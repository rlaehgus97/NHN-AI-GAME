<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>지옥철 생존기</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="canvasWrap"></div>

  <!-- ============ HUD ============ -->
  <div id="hudLeft" class="hud">
    <div class="hudBlock">
      <div class="barLabel"><span>😵 통근 스트레스</span><span id="healthNum">0</span></div>
      <div class="bar"><span id="healthFill"></span></div>
      <div id="healthWarn"></div>
      <div class="barLabel" style="margin-top:6px"><span>⭐ 명예</span><span id="honorNum">50</span></div>
      <div class="bar"><span id="honorFill"></span></div>
      <div id="honorGrade" style="font-size:12px;font-weight:700;">평범한 시민</div>
      <div id="honorWarn"></div>
    </div>
    <div class="hudBlock">
      <div id="postureTag">자세: 서 있음</div>
      <div id="buffRow"></div>
    </div>
  </div>

  <div id="hudRight" class="hud">
    <div class="hudBlock">
      <div id="timeText">45.0</div>
      <div id="stationText">출발</div>
      <div id="progressTrack"><div id="progressFill"></div></div>
      <div class="stationDots"><span>출발</span><span>1역</span><span>2역</span><span>3역</span><span>목적지</span></div>
      <div id="bagCd">가방: 준비됨</div>
    </div>
  </div>

  <div id="hudBottom" class="hud">
    <div id="interactPrompt">&nbsp;</div>
    <div id="controlsHint">WASD 이동 · SHIFT 대시 · F/클릭 가방 · E 상호작용 · SPACE 빈자리 착석</div>
  </div>

  <div id="centerMsg" class="hud"><span></span></div>
  <div id="screenFx" aria-hidden="true"></div>
  <button id="soundToggle" type="button" aria-label="소리 끄기" title="소리 켜기/끄기">🔊</button>

  <div id="seatGaugeWrap" class="hud">
    <div id="seatGaugeLabel">빈자리 착석: SPACE</div>
    <div id="seatGauge"><div id="seatGaugeFill"></div></div>
  </div>

  <!-- ============ 시작 화면 ============ -->
  <div id="startScreen" class="overlay">
    <div class="panel">
      <h1>🚇 지옥철 생존기</h1>
      <p>퇴근길 지옥철. 역별 이벤트를 버텨 목적지에서 직접 하차하라.</p>
      <p>통근 스트레스를 관리하고, 명예를 잃지 말 것.</p>
      <div class="ctrlList">
        <div><b>WASD</b> 이동</div>
        <div><b>SHIFT</b> 대시</div>
        <div><b>SPACE</b> 빈자리 착석</div>
        <div><b>E</b> 손잡이 / 좌석 / 출구</div>
        <div><b>F / 좌클릭</b> 가방 휘두르기</div>
        <div><b>1 / 2</b> 이벤트 선택</div>
      </div>
      <button id="startBtn" class="btn">Game Start</button>
    </div>
  </div>

  <!-- ============ 이벤트 모달 (자리 양보) ============ -->
  <div id="eventOverlay" class="overlay hidden">
    <div class="panel" id="eventPanel">
      <h2 id="eventTitle">이벤트</h2>
      <p id="eventDesc"></p>
      <div class="choiceRow">
        <button id="choice1" class="btn">선택 1<span class="kbd">[1]</span></button>
        <button id="choice2" class="btn secondary">선택 2<span class="kbd">[2]</span></button>
      </div>
    </div>
  </div>

  <!-- ============ 결과 화면 ============ -->
  <div id="resultOverlay" class="overlay hidden">
    <div class="panel">
      <h1 id="resultTitle">결과</h1>
      <p id="resultReason"></p>
      <div id="resultStats"></div>
      <button id="restartBtn" class="btn">다시 하기</button>
      <button id="reloadBtn" class="btn secondary">새로고침</button>
    </div>
  </div>

  <!-- Three.js (UMD 전역 빌드 — file:// 에서도 바로 실행 가능) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script type="module" src="js/modules/runtime.js?v=stage-systems-4"></script>

  <!-- 게임 스크립트: 의존 관계상 아래 순서로 로드 -->
  <script src="js/constants.js?v=stage-systems-4"></script>
  <script src="js/state.js?v=stage-systems-5"></script>
  <script src="js/audio.js?v=stage-systems-4"></script>
  <script src="js/effects.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/hazards.js?v=stage-systems-5"></script>
  <script src="js/entities.js?v=stage-systems-9"></script>
  <script src="js/player.js?v=stage-systems-8"></script>
  <script src="js/ai.js?v=stage-systems-8"></script>
  <script src="js/systems.js?v=stage-systems-4"></script>
  <script src="js/ui.js?v=stage-systems-5"></script>
  <script src="js/main.js?v=stage-systems-9"></script>
</body>
</html>
