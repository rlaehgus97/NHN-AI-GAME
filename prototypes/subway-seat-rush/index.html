<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>지옥철 생존기</title>
<style>
  /* ============ UI / HUD 스타일 ============ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #d9d9d9; }
  body { font-family: "Segoe UI", "Malgun Gothic", sans-serif; color: #222; user-select: none; }
  #canvasWrap { position: fixed; inset: 0; }
  canvas { display: block; }

  .hud { position: fixed; pointer-events: none; z-index: 10; }

  /* 좌측 상단: 체력 / 명예 / 자세 / 버프 */
  #hudLeft { top: 12px; left: 12px; width: 260px; }
  .bar { width: 100%; height: 18px; background: rgba(0,0,0,.18); border-radius: 10px;
         overflow: hidden; margin-top: 3px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.5); }
  .bar > span { display: block; height: 100%; width: 100%; transition: width .12s linear; }
  #healthFill { background: linear-gradient(90deg,#e74c3c,#ff7b6b); }
  #honorFill  { background: linear-gradient(90deg,#3498db,#6fc1ff); }
  .barLabel { font-size: 13px; font-weight: 700; display:flex; justify-content:space-between; }
  .hudBlock { background: rgba(255,255,255,.72); border-radius: 12px; padding: 8px 10px;
              margin-bottom: 8px; box-shadow: 0 3px 8px rgba(0,0,0,.12); }
  #postureTag { font-size: 12px; font-weight: 700; }
  #buffRow { font-size: 12px; color:#2e7d32; font-weight:700; min-height: 16px; }
  #healthWarn { color:#c0392b; font-weight:800; font-size:12px; min-height:14px; }
  #honorWarn { color:#c0392b; font-weight:800; font-size:12px; min-height:14px; }

  /* 우측 상단: 시간 / 역 진행도 */
  #hudRight { top: 12px; right: 12px; width: 260px; text-align: right; }
  #timeText { font-size: 26px; font-weight: 800; }
  #stationText { font-size: 13px; font-weight: 700; margin-top: 2px; }
  #progressTrack { position: relative; height: 8px; background: rgba(0,0,0,.18);
                   border-radius: 6px; margin-top: 6px; }
  #progressFill { position:absolute; left:0; top:0; height:100%; background:#f39c12; border-radius:6px; }
  .stationDots { display:flex; justify-content:space-between; font-size:10px; margin-top:3px; font-weight:700; color:#555; }
  #bagCd { font-size:12px; font-weight:700; margin-top:4px; }

  /* 하단 중앙: 상호작용 / 조작 안내 */
  #hudBottom { bottom: 14px; left: 50%; transform: translateX(-50%); text-align:center; width: 90%; }
  #interactPrompt { display:inline-block; background: rgba(30,30,30,.82); color:#fff;
        padding: 7px 16px; border-radius: 20px; font-size: 15px; font-weight:700; min-height: 20px; }
  #controlsHint { margin-top:6px; font-size:12px; color:#333; background:rgba(255,255,255,.7);
        display:inline-block; padding:4px 10px; border-radius:14px; }

  /* 화면 중앙 순간 메시지 */
  #centerMsg { top: 20%; left:50%; transform:translateX(-50%); text-align:center; width: 80%; }
  #centerMsg span { display:inline-block; background: rgba(20,20,20,.8); color:#fff;
        padding:10px 20px; border-radius:14px; font-size:20px; font-weight:800;
        opacity:0; transition: opacity .2s; }
  #centerMsg.show span { opacity:1; }
  #centerMsg.warn span { background: rgba(180,30,30,.9); }

  /* 좌석 경쟁 게이지 */
  #seatGaugeWrap { bottom: 90px; left:50%; transform:translateX(-50%); text-align:center; display:none; }
  #seatGaugeWrap.show { display:block; }
  #seatGauge { width: 220px; height: 16px; background: rgba(0,0,0,.25); border-radius:10px; overflow:hidden;
        box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); }
  #seatGaugeFill { height:100%; width:0%; background: linear-gradient(90deg,#27ae60,#7bed9f); transition: width .05s; }
  #seatGaugeLabel { font-size:13px; font-weight:800; margin-bottom:4px; background:rgba(255,255,255,.8);
        display:inline-block; padding:2px 10px; border-radius:10px; }

  /* 전체 화면 오버레이 (시작/결과/이벤트) */
  .overlay { position: fixed; inset:0; z-index: 30; display:flex; align-items:center; justify-content:center;
        background: rgba(20,22,26,.72); pointer-events:auto; }
  .panel { background:#fdfdfb; border-radius:20px; padding: 30px 34px; max-width: 460px; width: 90%;
        text-align:center; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  .panel h1 { font-size: 30px; margin-bottom: 8px; }
  .panel h2 { font-size: 24px; margin-bottom: 10px; }
  .panel p { font-size: 14px; line-height: 1.6; color:#444; margin-bottom: 6px; }
  .btn { margin-top: 16px; background:#f39c12; color:#fff; border:none; border-radius: 12px;
        padding: 12px 26px; font-size: 17px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 #c87f0a; }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #c87f0a; }
  .btn.secondary { background:#7f8c8d; box-shadow:0 4px 0 #5f6a6b; margin-left:8px; }
  .ctrlList { text-align:left; font-size:13px; margin: 14px auto 0; max-width: 320px; line-height:1.8; }
  .ctrlList b { display:inline-block; min-width: 92px; color:#c0392b; }
  .hidden { display:none !important; }

  /* 이벤트 선택 모달 */
  #eventPanel .choiceRow { display:flex; gap:10px; margin-top:16px; }
  #eventPanel .choiceRow .btn { flex:1; margin:0; font-size:15px; }
  #eventPanel .kbd { font-size:11px; opacity:.8; display:block; margin-top:2px; font-weight:600;}
  .resultStat { font-size:14px; text-align:left; max-width:280px; margin:6px auto; }
  .resultStat b { color:#c0392b; }
</style>
</head>
<body>
  <div id="canvasWrap"></div>

  <!-- ============ HUD ============ -->
  <div id="hudLeft" class="hud">
    <div class="hudBlock">
      <div class="barLabel"><span>❤ 체력</span><span id="healthNum">100</span></div>
      <div class="bar"><span id="healthFill"></span></div>
      <div id="healthWarn"></div>
      <div class="barLabel" style="margin-top:6px"><span>⭐ 명예</span><span id="honorNum">50</span></div>
      <div class="bar"><span id="honorFill"></span></div>
      <div id="honorGrade" style="font-size:12px;font-weight:700;">평범한 시민</div>
      <div id="honorWarn"></div>
    </div>
    <div class="hudBlock">
      <div id="postureTag">자세: 서 있음</div>
      <div id="buffRow"></div>
    </div>
  </div>

  <div id="hudRight" class="hud">
    <div class="hudBlock">
      <div id="timeText">45.0</div>
      <div id="stationText">출발</div>
      <div id="progressTrack"><div id="progressFill"></div></div>
      <div class="stationDots"><span>출발</span><span>1역</span><span>2역</span><span>3역</span><span>목적지</span></div>
      <div id="bagCd">가방: 준비됨</div>
    </div>
  </div>

  <div id="hudBottom" class="hud">
    <div id="interactPrompt">&nbsp;</div>
    <div id="controlsHint">WASD 이동 · SHIFT 대시 · F/클릭 가방 · E 상호작용 · SPACE 착석경쟁</div>
  </div>

  <div id="centerMsg" class="hud"><span></span></div>

  <div id="seatGaugeWrap" class="hud">
    <div id="seatGaugeLabel">자리 차지! SPACE 연타</div>
    <div id="seatGauge"><div id="seatGaugeFill"></div></div>
  </div>

  <!-- ============ 시작 화면 ============ -->
  <div id="startScreen" class="overlay">
    <div class="panel">
      <h1>🚇 지옥철 생존기</h1>
      <p>퇴근길 지옥철. <b>45초</b>를 버텨 목적지에서 하차하라.</p>
      <p>체력을 지키고, 명예를 잃지 말 것.</p>
      <div class="ctrlList">
        <div><b>WASD</b> 이동</div>
        <div><b>SHIFT</b> 대시</div>
        <div><b>SPACE</b> 좌석 경쟁 연타</div>
        <div><b>E</b> 손잡이 / 좌석 / 출구</div>
        <div><b>F / 좌클릭</b> 가방 휘두르기</div>
        <div><b>1 / 2</b> 이벤트 선택</div>
      </div>
      <button id="startBtn" class="btn">Game Start</button>
    </div>
  </div>

  <!-- ============ 이벤트 모달 (자리 양보) ============ -->
  <div id="eventOverlay" class="overlay hidden">
    <div class="panel" id="eventPanel">
      <h2 id="eventTitle">이벤트</h2>
      <p id="eventDesc"></p>
      <div class="choiceRow">
        <button id="choice1" class="btn">선택 1<span class="kbd">[1]</span></button>
        <button id="choice2" class="btn secondary">선택 2<span class="kbd">[2]</span></button>
      </div>
    </div>
  </div>

  <!-- ============ 결과 화면 ============ -->
  <div id="resultOverlay" class="overlay hidden">
    <div class="panel">
      <h1 id="resultTitle">결과</h1>
      <p id="resultReason"></p>
      <div id="resultStats"></div>
      <button id="restartBtn" class="btn">다시 하기</button>
      <button id="reloadBtn" class="btn secondary">새로고침</button>
    </div>
  </div>

  <!-- Three.js (UMD 전역 빌드 — file:// 에서도 바로 실행 가능) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  "use strict";
  /* =====================================================================
     지옥철 생존기 — 단일 파일 Three.js 프로토타입
     섹션 구성:
       // Game constants and balance
       // Game state / enums
       // Scene setup
       // Subway environment
       // Player
       // NPC passengers
       // Seats and handles
       // Villains
       // Event manager
       // Health and honor systems
       // Interaction system
       // UI manager
       // Stage timer and station manager
       // Collision handling
       // Animation loop
       // Reset and restart
  ===================================================================== */

  /* ============ Game constants and balance ============ */
  const BALANCE = {
    stageDuration: 45,
    boardingDuration: 3,
    seatRushDuration: 7,
    arrivalExitDuration: 8,

    maxHealth: 100,
    maxHonor: 100,
    startHonor: 50,

    standingDrainPerSecond: 2.2,
    crowdedDrainMultiplier: 1.5,   // (프로토타입: 빌런 근접시 적용)
    villainDrainMultiplier: 1.8,
    seatedRecoveryPerSecond: 5,
    handleDrainPerSecond: 0.5,

    villainCollisionDamage: 10,
    suddenStopDamage: 8,

    bagAttackCooldown: 0.65,
    bagAttackRange: 2.2,
    bagAttackArc: Math.PI * 0.65,

    villainDefeatHealthReward: 10,
    villainDefeatHonorReward: 10,

    yieldSeatHonorReward: 20,
    ignoreSeatHonorPenalty: 35,

    kindnessBuffDuration: 8,
    kindnessDrainMultiplier: 0.5,

    // 플레이어 이동
    moveSpeed: 4.2,
    dashSpeed: 7.5,
    // 좌석 경쟁
    seatCaptureGainPerPress: 22,
    seatCaptureDecayPerSecond: 14,
    npcCaptureRatePerSecond: 20
  };

  /* ============ Game state / enums ============ */
  const GameState = {
    READY: 'READY', BOARDING: 'BOARDING', SEAT_RUSH: 'SEAT_RUSH',
    TRAVELING: 'TRAVELING', EVENT: 'EVENT', ARRIVAL: 'ARRIVAL',
    CLEAR: 'CLEAR', GAME_OVER: 'GAME_OVER'
  };
  const Posture = { STANDING:'STANDING', SEATED:'SEATED', HOLDING_HANDLE:'HOLDING_HANDLE' };

  // 차량 내부 경계 (aisle)
  const CAR = { xMin:-7.3, xMax:7.3, aisleZMin:-1.25, aisleZMax:1.25,
                doorX:1.5, platformZ:-3.6, farWallZ:-2.2, nearWallZ:2.2 };

  /* ============ Globals ============ */
  let scene, camera, renderer, clock;
  let player;                 // THREE.Group
  let seats = [];             // Seat objects
  let handles = [];           // HandlePoint objects
  let npcs = [];              // NPCPassenger (ambient + competitors)
  let villains = [];          // Villain objects
  let doorLeft, doorRight;    // 문 메시
  let exitMarker;             // 출구 표시
  const keys = {};            // 눌린 키 상태
  let leftMouseDown = false;
  let started = false;        // 애니메이션 루프 1회만 시작

  // 게임 진행 상태
  const G = {};

  function resetGameData() {
    G.state = GameState.READY;
    G.posture = Posture.STANDING;
    G.health = BALANCE.maxHealth;
    G.honor = BALANCE.startHonor;
    G.timeLeft = BALANCE.stageDuration;
    G.stateTimer = 0;          // 현재 상태 경과
    G.stageElapsed = 0;        // TRAVELING 총 경과
    G.stationIndex = 0;
    G.doorsOpen = false;
    G.occupiedSeat = null;
    G.heldHandle = null;
    G.bagCooldown = 0;
    G.bagSwing = 0;            // 스윙 애니메이션 타이머
    G.facing = new THREE.Vector2(0, -1); // 기본: 차량 안쪽(위)
    G.kindness = { active:false, remaining:0, mult:1 };
    G.villainRewardBuff = 0;   // 빌런 보상: 잠깐 감소량 30%↓ 남은시간
    G.stun = 0;                // 경직
    G.shake = 0;               // 화면 흔들림 잔량
    G.goodDeeds = 0;
    G.villainsDefeated = 0;
    G.arrivalTimeLeft = BALANCE.arrivalExitDuration;
    G.exitReached = false;
    // 이벤트 플래그
    G.flags = { drunkSpawned:false, backpackSpawned:false, yieldDone:false,
                suddenStopWarned:false, suddenStopDone:false, yieldReturnPosture:null };
    G.eventReturnState = null;
    G.prioritySeatTimer = 0;   // 빌런 퇴치 후 우선 착석 안내 시간
    G.centerMsgTimer = 0;
  }

  /* ============ Scene setup ============ */
  function initScene() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb4b8bd);
    scene.fog = new THREE.Fog(0xb4b8bd, 20, 38);

    camera = new THREE.PerspectiveCamera(52, window.innerWidth/window.innerHeight, 0.1, 200);
    camera.position.set(0, 9, 10);
    camera.lookAt(0, 0.8, 0);

    renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('canvasWrap').appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xdfe3e8, 0x8b8f95, 0.55);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 0.45);
    dir.position.set(6, 14, 8);
    dir.castShadow = true;
    dir.shadow.mapSize.set(1024,1024);
    dir.shadow.camera.left=-16; dir.shadow.camera.right=16;
    dir.shadow.camera.top=12; dir.shadow.camera.bottom=-12;
    scene.add(dir);
    const amb = new THREE.AmbientLight(0xffffff, 0.22);
    scene.add(amb);

    clock = new THREE.Clock();
  }

  /* ============ Subway environment ============ */
  function matClay(hex){ return new THREE.MeshStandardMaterial({ color:hex, roughness:0.95, metalness:0.0 }); }

  function buildEnvironment() {
    const carLen = 15.4, carWidth = 4.6;

    // 바닥 (차량 + 승강장)
    const floor = new THREE.Mesh(new THREE.BoxGeometry(carLen+1, 0.2, carWidth), matClay(0xececec));
    floor.position.set(0,-0.1,0); floor.receiveShadow = true; scene.add(floor);

    const platform = new THREE.Mesh(new THREE.BoxGeometry(carLen+1, 0.2, 3.4), matClay(0xd2d5da));
    platform.position.set(0,-0.1, CAR.farWallZ - 1.9); platform.receiveShadow = true; scene.add(platform);

    // 원경 벽 (far wall) — 문 구멍 자리는 두 조각으로 분리
    const wallMat = matClay(0xf3f3f1);
    const wallH = 2.9;
    function wallSeg(x, w){
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, wallH, 0.25), wallMat);
      m.position.set(x, wallH/2, CAR.farWallZ); m.receiveShadow=true; m.castShadow=true; scene.add(m);
    }
    const halfDoor = CAR.doorX;             // 문폭 절반
    const segW = (carLen/2) - halfDoor;
    wallSeg(-(halfDoor + segW/2), segW);
    wallSeg( (halfDoor + segW/2), segW);
    // 문 상단 인방
    const lintel = new THREE.Mesh(new THREE.BoxGeometry(halfDoor*2, 0.5, 0.25), wallMat);
    lintel.position.set(0, wallH-0.25, CAR.farWallZ); scene.add(lintel);

    // 양끝 벽
    [ -carLen/2-0.2, carLen/2+0.2 ].forEach(x=>{
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.25, wallH, carWidth), wallMat);
      m.position.set(x, wallH/2, 0); m.receiveShadow=true; scene.add(m);
    });
    // 근경(near)은 카메라를 위해 낮은 난간만
    const rail = new THREE.Mesh(new THREE.BoxGeometry(carLen, 0.4, 0.2), matClay(0xdadada));
    rail.position.set(0, 0.2, CAR.nearWallZ); scene.add(rail);

    // 천장 손잡이 바
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,carLen,10), matClay(0xbfc3c8));
    bar.rotation.z = Math.PI/2; bar.position.set(0, 2.55, 0); scene.add(bar);

    // 문 (슬라이딩 2짝)
    const doorMat = new THREE.MeshStandardMaterial({ color:0xbfd4e0, roughness:0.6, metalness:0.1,
                     transparent:true, opacity:0.85 });
    doorLeft  = new THREE.Mesh(new THREE.BoxGeometry(halfDoor, wallH-0.5, 0.12), doorMat);
    doorRight = new THREE.Mesh(new THREE.BoxGeometry(halfDoor, wallH-0.5, 0.12), doorMat.clone());
    doorLeft.position.set(-halfDoor/2, (wallH-0.5)/2, CAR.farWallZ);
    doorRight.position.set( halfDoor/2, (wallH-0.5)/2, CAR.farWallZ);
    scene.add(doorLeft); scene.add(doorRight);

    // 출구 표시(바닥 하이라이트) — 기본 숨김
    exitMarker = new THREE.Mesh(new THREE.CircleGeometry(1.1, 24),
        new THREE.MeshStandardMaterial({ color:0x2ecc71, roughness:1, transparent:true, opacity:0.0 }));
    exitMarker.rotation.x = -Math.PI/2;
    exitMarker.position.set(0, 0.02, CAR.farWallZ - 1.4);
    scene.add(exitMarker);

    buildBenchesAndSeats();
    buildHandles();
  }

  /* ============ Seats and handles ============ */
  function buildBenchesAndSeats() {
    // 벤치(양쪽 벽) — 낮은 형태로 카메라 시야 확보
    const benchMat = matClay(0xcfd3d8);
    [ -1.75, 1.75 ].forEach(z=>{
      const bench = new THREE.Mesh(new THREE.BoxGeometry(13.6, 0.45, 0.9), benchMat);
      bench.position.set(0, 0.22, z); bench.receiveShadow=true; scene.add(bench);
      const back = new THREE.Mesh(new THREE.BoxGeometry(13.6, 0.7, 0.18), benchMat);
      back.position.set(0, 0.6, z + (z<0? -0.36 : 0.36)); scene.add(back);
    });

    // 좌석 5개 (원경 4 + 근경 1)
    const seatDefs = [
      { x:-5, z:-1.7, face: 1 },
      { x:-3, z:-1.7, face: 1 },
      { x: 3, z:-1.7, face: 1 },
      { x: 5, z:-1.7, face: 1 },
      { x: 0, z: 1.7, face:-1 }
    ];
    const seatMat = matClay(0x9aa0a8);
    seatDefs.forEach((d,i)=>{
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.12, 0.8), seatMat.clone());
      mesh.position.set(d.x, 0.5, d.z); scene.add(mesh);
      const point = { x: d.x, z: d.z + d.face*0.95 }; // 통로쪽 상호작용 위치
      seats.push({ mesh, x:d.x, z:d.z, face:d.face, occupied:false, occupant:null,
                   interactionPoint:point, captureProgress:0, captureBy:null });
    });
  }

  function buildHandles() {
    const ringMat = matClay(0xe0a94b);
    [ -4.5, -1.5, 1.5, 4.5 ].forEach(x=>{
      const mesh = new THREE.Mesh(new THREE.TorusGeometry(0.18,0.05,8,16), ringMat.clone());
      mesh.position.set(x, 2.1, 0); mesh.rotation.x = Math.PI/2 * 0; scene.add(mesh);
      // 손잡이 끈
      const strap = new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.4,6), matClay(0xcccccc));
      strap.position.set(x, 2.35, 0); scene.add(strap);
      handles.push({ mesh, x, z:0, occupied:false, occupant:null });
    });
  }

  /* ============ Character factory (클레이 스타일) ============ */
  function makeCharacter(bodyColor, headColor) {
    const g = new THREE.Group();
    const bodyMat = matClay(bodyColor);
    const headMat = matClay(headColor || 0xf1c9a5);

    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.42,0.85,16), bodyMat);
    body.position.y = 0.55; body.castShadow=true; g.add(body);
    const belly = new THREE.Mesh(new THREE.SphereGeometry(0.42,16,12), bodyMat);
    belly.position.y = 0.55; belly.scale.set(1,0.8,1); g.add(belly);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.32,16,14), headMat);
    head.position.y = 1.25; head.castShadow=true; g.add(head);
    // 다리
    [-0.18,0.18].forEach(x=>{
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.35,10), bodyMat);
      leg.position.set(x,0.17,0); g.add(leg);
    });
    // 팔
    const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.4,10), bodyMat);
    armL.position.set(-0.42,0.6,0); armL.rotation.z=0.3; g.add(armL);
    const armR = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.4,10), bodyMat);
    armR.position.set(0.42,0.6,0); armR.rotation.z=-0.3; g.add(armR);

    g.userData.head = head; g.userData.armR = armR; g.userData.armL = armL;
    g.userData.baseArmRz = -0.3;
    return g;
  }

  // 머리 위 아이콘(스프라이트 대신 간단한 텍스트 캔버스)
  function makeTag(text, color) {
    const cv = document.createElement('canvas'); cv.width=128; cv.height=64;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = color || '#e74c3c'; ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(4,4,120,40,10) : ctx.rect(4,4,120,40); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 26px sans-serif'; ctx.textAlign='center';
    ctx.fillText(text, 64, 33);
    const tex = new THREE.CanvasTexture(cv);
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true }));
    spr.scale.set(0.9,0.45,1); spr.position.y = 1.9;
    return spr;
  }

  /* ============ Player ============ */
  function buildPlayer() {
    player = makeCharacter(0x4a90d9, 0xf1c9a5);
    // 가방 (휘두르기용)
    const bag = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.5,0.22), matClay(0x8e5a3c));
    bag.position.set(0.55, 0.55, 0.15);
    player.add(bag); player.userData.bag = bag;
    const tag = makeTag('나', '#2d78c9'); player.add(tag);
    scene.add(player);
  }

  /* ============ NPC passengers ============ */
  // kind: 'ambient' | 'competitor'
  function spawnNPC(kind, x, z) {
    const color = kind==='competitor' ? 0x9b8f80 : 0xa9adb2;
    const mesh = makeCharacter(color, 0xe8c39e);
    mesh.position.set(x, 0, z);
    scene.add(mesh);
    const npc = { mesh, kind, targetSeat:null, seated:false, seatRef:null,
                  vx:0, vz:0, x, z, standSpot:{x,z}, isYielder:false, wobble:Math.random()*6,
                  wanderTX:x, wanderTZ:z, wanderTimer:Math.random()*2, wanderSpeed:1.3+Math.random()*0.9 };
    npcs.push(npc);
    return npc;
  }

  function spawnPassengers() {
    // 경쟁 승객 6명 — 승강장에서 진입
    for (let i=0;i<6;i++){
      const x = -5 + i*2;
      spawnNPC('competitor', x, CAR.platformZ + (Math.random()*0.6));
    }
    // 배경 승객 몇 명 — 통로에 분산 (좌석 경쟁 안 함)
    const ambientSpots = [[-6.5,0.4],[6.5,-0.4],[-2,0.6],[2,-0.6]];
    ambientSpots.forEach(s=> spawnNPC('ambient', s[0], s[1]));
  }

  /* ============ Villains ============ */
  function makeVillainMesh(type){
    if (type==='drunk'){
      const g = makeCharacter(0xc0392b, 0xd98b7a);
      g.add(makeTag('취객','#c0392b'));
      return g;
    } else {
      const g = makeCharacter(0x8e44ad, 0xd0a3e0);
      // 등에 큰 백팩
      const pack = new THREE.Mesh(new THREE.BoxGeometry(0.7,0.8,0.5), matClay(0x5b2c6f));
      pack.position.set(0,0.6,-0.45); g.add(pack);
      g.add(makeTag('백팩','#8e44ad'));
      return g;
    }
  }

  function spawnVillain(type){
    const mesh = makeVillainMesh(type);
    const x = (Math.random()<0.5? -6.5 : 6.5);
    mesh.position.set(x, 0, 0.2);
    scene.add(mesh);
    const v = {
      type, mesh, x, z:0.2,
      hp: (type==='drunk'?3:3),
      state: (type==='drunk'?'WANDER':'MOVE'),
      timer: 0, dirX:(Math.random()<0.5?-1:1), dirZ:(Math.random()<0.5?-1:1),
      hitFlash:0, defeated:false, telegraph:0, spinTimer:0, cooldown:0,
      dmgCooldown:0
    };
    villains.push(v);
    showCenter(type==='drunk'? '⚠ 만취 비틀이 등장!' : '⚠ 백팩 회전맨 등장!', true, 1.6);
    return v;
  }

  /* ============ Health and honor systems ============ */
  function damage(amount){
    G.health = Math.max(0, G.health - amount);
    if (G.health <= 0 && G.state === GameState.TRAVELING){
      endGame(false, '체력이 모두 소진되었습니다.');
    }
  }
  function heal(amount){ G.health = Math.min(BALANCE.maxHealth, G.health + amount); }
  function addHonor(amount){ G.honor = Math.max(0, Math.min(BALANCE.maxHonor, G.honor + amount)); }
  function honorGrade(h){
    if (h>=70) return '의인';
    if (h>=40) return '평범한 시민';
    if (h>=1)  return '눈치 없는 승객';
    return '인간성 상실';
  }

  function applyKindnessBuff(){
    G.kindness.active = true;
    G.kindness.remaining = BALANCE.kindnessBuffDuration;
    G.kindness.mult = BALANCE.kindnessDrainMultiplier;
  }

  /* ============ Interaction system ============ */
  function dist2(ax,az,bx,bz){ const dx=ax-bx,dz=az-bz; return dx*dx+dz*dz; }

  function nearestEmptySeat(px,pz,maxD){
    let best=null, bd=maxD*maxD;
    seats.forEach(s=>{
      if (s.occupied) return;
      const d = dist2(px,pz, s.interactionPoint.x, s.interactionPoint.z);
      if (d<bd){ bd=d; best=s; }
    });
    return best;
  }
  function nearestFreeHandle(px,pz,maxD){
    let best=null, bd=maxD*maxD;
    handles.forEach(h=>{ if(h.occupied) return;
      const d=dist2(px,pz,h.x,h.z); if(d<bd){bd=d;best=h;} });
    return best;
  }

  function sitOnSeat(seat){
    seat.occupied=true; seat.occupant='player'; seat.captureProgress=0; seat.captureBy=null;
    G.occupiedSeat = seat;
    setPosture(Posture.SEATED);
    player.position.set(seat.x, 0, seat.z + (seat.face>0? 0.05 : -0.05));
  }
  function standUpFromSeat(){
    if (G.occupiedSeat){ G.occupiedSeat.occupied=false; G.occupiedSeat.occupant=null; }
    const s = G.occupiedSeat; G.occupiedSeat=null;
    setPosture(Posture.STANDING);
    if (s) player.position.set(s.x, 0, s.interactionPoint.z);
  }
  function grabHandle(h){
    h.occupied=true; h.occupant='player'; G.heldHandle=h;
    setPosture(Posture.HOLDING_HANDLE);
    player.position.set(h.x, 0, 0);
  }
  function releaseHandle(){
    if (G.heldHandle){ G.heldHandle.occupied=false; G.heldHandle.occupant=null; }
    G.heldHandle=null; setPosture(Posture.STANDING);
  }

  function setPosture(p){
    G.posture = p;
    // 시각적 구분
    if (p===Posture.SEATED){ player.scale.set(1,0.72,1); }
    else { player.scale.set(1,1,1); }
    // 손잡이: 오른팔 위로
    if (player.userData.armR){
      player.userData.armR.rotation.z = (p===Posture.HOLDING_HANDLE)? -1.9 : player.userData.baseArmRz;
    }
  }

  /* ============ Bag attack ============ */
  function tryBagAttack(){
    if (G.state!==GameState.TRAVELING && G.state!==GameState.ARRIVAL) return;
    if (G.posture!==Posture.STANDING) return;
    if (G.bagCooldown>0 || G.stun>0) return;
    G.bagCooldown = BALANCE.bagAttackCooldown;
    G.bagSwing = 0.28;
    const px=player.position.x, pz=player.position.z;
    const fdir = new THREE.Vector2(G.facing.x, G.facing.y).normalize();
    let hitAny=false;
    villains.forEach(v=>{
      if (v.defeated) return;
      const dx=v.x-px, dz=v.z-pz;
      const d = Math.hypot(dx,dz);
      if (d>BALANCE.bagAttackRange || d<0.01) return;
      const toV = new THREE.Vector2(dx,dz).normalize();
      const ang = Math.acos(THREE.MathUtils.clamp(fdir.dot(toV),-1,1));
      if (ang <= BALANCE.bagAttackArc/2){
        hitVillain(v, toV);
        hitAny=true;
      }
    });
    if (hitAny){ G.shake = Math.max(G.shake, 0.25); showCenter('퍽! 민폐 승객을 밀어냈습니다', false, 0.8); }
  }

  function hitVillain(v, dir){
    // 백팩맨: TELEGRAPH 중 맞으면 회전 취소
    if (v.type==='backpack' && v.state==='TELEGRAPH'){ v.state='COOLDOWN'; v.cooldown=1.2; v.telegraph=0; }
    v.hp -= 1; v.hitFlash = 0.25; v.state='HIT'; v.timer=0;
    // 넉백
    v.x += dir.x*0.9; v.z += dir.z*0.6;
    v.z = THREE.MathUtils.clamp(v.z, -1.2, 1.2);
    v.x = THREE.MathUtils.clamp(v.x, CAR.xMin, CAR.xMax);
    if (v.hp<=0){ defeatVillain(v); }
  }

  function defeatVillain(v){
    v.defeated=true; v.state='DEFEATED';
    scene.remove(v.mesh);
    G.villainsDefeated++;
    // 보상
    heal(BALANCE.villainDefeatHealthReward);
    addHonor(BALANCE.villainDefeatHonorReward);
    G.villainRewardBuff = 5; // 5초간 감소 30%↓
    // 서 있으면 우선 착석 기회
    if (G.posture===Posture.STANDING){
      const freed = freeUpOneSeat();
      if (freed){
        G.prioritySeatTimer = 5;
        showCenter('민폐 승객을 막아낸 당신에게 누군가 자리를 양보했습니다!', false, 2.2);
      } else {
        showCenter('빌런 퇴치! 체력·명예 회복', false, 1.6);
      }
    } else {
      showCenter('빌런 퇴치! 체력·명예 회복', false, 1.6);
    }
  }

  // 앉아있던 일반 NPC 하나를 일으켜 좌석을 비움
  function freeUpOneSeat(){
    for (const s of seats){
      if (s.occupied && s.occupant && s.occupant!=='player' && s.occupant.kind){
        const npc = s.occupant;
        npc.seated=false; npc.seatRef=null;
        s.occupied=false; s.occupant=null; s.captureProgress=0;
        // NPC를 통로로
        npc.targetSeat=null;
        return s;
      }
    }
    return null;
  }

  /* ============ Event manager (자리 양보 / 급정거) ============ */
  function openYieldEvent(){
    G.flags.yieldDone = true;
    G.eventReturnState = G.state;
    G.state = GameState.EVENT;
    // 양보 NPC 등장 (플레이어 앞)
    const s = G.occupiedSeat;
    const yn = spawnNPC('ambient', s.x, s.interactionPoint.z);
    yn.isYielder = true; yn.mesh.add(makeTag('노약자','#e67e22'));
    G._yielder = yn;
    const ov = document.getElementById('eventOverlay');
    document.getElementById('eventTitle').textContent = '자리 양보?';
    document.getElementById('eventDesc').textContent = '힘들어 보이는 승객이 당신 앞에 서 있습니다.';
    document.getElementById('choice1').innerHTML = '자리 양보<span class="kbd">[1]</span>';
    document.getElementById('choice2').innerHTML = '모른 척하기<span class="kbd">[2]</span>';
    ov.classList.remove('hidden');
  }
  function resolveYield(choice){
    const ov = document.getElementById('eventOverlay');
    ov.classList.add('hidden');
    const yn = G._yielder;
    if (choice===1){
      addHonor(BALANCE.yieldSeatHonorReward);
      heal(10); G.goodDeeds++;
      applyKindnessBuff();
      // NPC가 앉음
      const s = G.occupiedSeat;
      standUpFromSeat();
      if (s && yn){ s.occupied=true; s.occupant=yn; yn.seated=true; yn.seatRef=s;
        yn.mesh.position.set(s.x,0,s.z); yn.mesh.scale.set(1,0.72,1); }
      showCenter('자리를 양보했습니다. 명예 상승!', false, 1.8);
    } else {
      addHonor(-BALANCE.ignoreSeatHonorPenalty);
      if (yn){ scene.remove(yn.mesh); npcs = npcs.filter(n=>n!==yn); }
      showCenter('모른 척했습니다... 주변의 따가운 시선', true, 1.8);
    }
    G._yielder=null;
    G.state = G.eventReturnState || GameState.TRAVELING;
    G.eventReturnState = null;
  }

  function triggerSuddenStopWarn(){
    G.flags.suddenStopWarned = true;
    showCenter('열차가 급정거합니다! 손잡이를 잡으세요!', true, 1.5);
  }
  function doSuddenStop(){
    G.flags.suddenStopDone = true;
    G.shake = Math.max(G.shake, 0.5);
    if (G.posture===Posture.SEATED){
      // 피해 없음
    } else if (G.posture===Posture.HOLDING_HANDLE){
      damage(BALANCE.suddenStopDamage * 0.25);
    } else {
      damage(BALANCE.suddenStopDamage);
      // 앞으로 넉백
      player.position.z += 1.0;
      G.stun = 0.4;
    }
    // NPC/빌런 흔들림
    villains.forEach(v=>{ if(!v.defeated){ v.z += 0.3; } });
  }

  /* ============ UI manager ============ */

    healthFill: document.getElementById('healthFill'),
    healthNum: document.getElementById('healthNum'),
    healthWarn: document.getElementById('healthWarn'),
    honorFill: document.getElementById('honorFill'),
    honorNum: document.getElementById('honorNum'),
    honorGrade: document.getElementById('honorGrade'),
    honorWarn: document.getElementById('honorWarn'),
    postureTag: document.getElementById('postureTag'),
    buffRow: document.getElementById('buffRow'),
    timeText: document.getElementById('timeText'),
    stationText: document.getElementById('stationText'),
    progressFill: document.getElementById('progressFill'),
    bagCd: document.getElementById('bagCd'),

    seatWrap: document.getElementById('seatGaugeWrap'),
    seatFill: document.getElementById('seatGaugeFill')
  };
  const STATION_NAMES = ['출발','1번째 역','2번째 역','3번째 역','목적지'];

  function updateHUD(){
    const hp = Math.round(G.health);
    UI.healthFill.style.width = (G.health/BALANCE.maxHealth*100)+'%';

    const pt = G.posture===Posture.SEATED?'앉음': G.posture===Posture.HOLDING_HANDLE?'손잡이':'서 있음';
    UI.postureTag.textContent = '자세: '+pt;

    let buffs=[];
    if (G.kindness.active) buffs.push('선행('+G.kindness.remaining.toFixed(0)+'s)');
    if (G.villainRewardBuff>0) buffs.push('의인('+G.villainRewardBuff.toFixed(0)+'s)');
    UI.buffRow.textContent = buffs.length? '버프: '+buffs.join(' · ') : '';

    UI.bagCd.textContent = G.bagCooldown>0 ? ('가방: '+G.bagCooldown.toFixed(1)+'s') : '가방: 준비됨';

  let centerTimer=0;
  function showCenter(text, warn, dur){
    UI.centerMsg.querySelector('span').textContent = text;
    UI.centerMsg.classList.toggle('warn', !!warn);
    UI.centerMsg.classList.add('show');
    centerTimer = dur||1.5;
  }

  function setInteract(text){ UI.interact.innerHTML = text || '&nbsp;'; }

  /* ============ Stage timer and station manager ============ */
  function updateStationProgress(){
    // 45초를 4구간으로: 11,22,33 에서 역 통과
    const e = G.stageElapsed;
    let idx = 0;
    if (e>=11) idx=1;
    if (e>=22) idx=2;
    if (e>=33) idx=3;
    if (e>=45) idx=4;
    if (idx !== G.stationIndex){
      G.stationIndex = idx;
      if (idx<4){ showCenter(STATION_NAMES[idx]+' 통과', false, 1.2); }
      // 역 통과시 퇴치된 빌런 정리 (이미 remove됨) / 흔들림 리셋
      G.shake = 0;
    }
  }

  // 스크립트 이벤트 스케줄
  function updateScriptedEvents(dt){
    const e = G.stageElapsed;
    if (!G.flags.drunkSpawned && e>=6){ G.flags.drunkSpawned=true; spawnVillain('drunk'); }
    if (!G.flags.backpackSpawned && e>=18){ G.flags.backpackSpawned=true; spawnVillain('backpack'); }
    // 자리 양보: 27초 이후, 앉아있으면 1회
    if (!G.flags.yieldDone && e>=27 && G.posture===Posture.SEATED){ openYieldEvent(); }
    // 급정거: 34초 경고 → 35.5초 실행
    if (!G.flags.suddenStopWarned && e>=34){ triggerSuddenStopWarn(); }
    if (G.flags.suddenStopWarned && !G.flags.suddenStopDone && e>=35.5){ doSuddenStop(); }
  }

  /* ============ Collision handling ============ */
  function resolvePlayerBounds(x, z){
    x = THREE.MathUtils.clamp(x, CAR.xMin, CAR.xMax);
    const inDoorX = Math.abs(x) < CAR.doorX;
    if (G.doorsOpen && inDoorX){
      // 문 열림: 승강장까지 왕래 가능
      z = THREE.MathUtils.clamp(z, CAR.platformZ, CAR.aisleZMax);
    } else {
      z = THREE.MathUtils.clamp(z, CAR.aisleZMin, CAR.aisleZMax);
    }
    return { x, z };
  }

  // 플레이어-NPC 간단 밀어내기
  function resolveNPCPush(){
    const px=player.position.x, pz=player.position.z;
    npcs.forEach(n=>{
      if (n.seated) return;
      const dx=px-n.mesh.position.x, dz=pz-n.mesh.position.z;
      const d=Math.hypot(dx,dz);
      const min=0.75;
      if (d<min && d>0.001){
        const push=(min-d)/2;
        n.mesh.position.x -= dx/d*push;
        n.mesh.position.z -= dz/d*push;
        n.x=n.mesh.position.x; n.z=n.mesh.position.z;
      }
    });
  }

  /* ============ Player update ============ */
  function updatePlayer(dt){
    // 입력 잠금 상태
    const canMove = (G.posture===Posture.STANDING) && G.stun<=0 &&
      (G.state===GameState.BOARDING || G.state===GameState.SEAT_RUSH ||
       G.state===GameState.TRAVELING || G.state===GameState.ARRIVAL);

    let mx=0, mz=0;
    if (canMove){
      if (keys['w']||keys['arrowup']) mz-=1;
      if (keys['s']||keys['arrowdown']) mz+=1;
      if (keys['a']||keys['arrowleft']) mx-=1;
      if (keys['d']||keys['arrowright']) mx+=1;
    }
    if (mx||mz){
      const len=Math.hypot(mx,mz); mx/=len; mz/=len;
      const spd = (keys['shift']? BALANCE.dashSpeed : BALANCE.moveSpeed);
      let nx=player.position.x+mx*spd*dt;
      let nz=player.position.z+mz*spd*dt;
      const r=resolvePlayerBounds(nx,nz);
      player.position.x=r.x; player.position.z=r.z;
      G.facing.set(mx,mz);
      // 바라보는 방향
      player.rotation.y = Math.atan2(mx, mz);
    }
    // 가방 스윙 애니메이션
    if (G.bagSwing>0){
      G.bagSwing-=dt;
      const t = Math.max(0,G.bagSwing)/0.28;
      if (player.userData.armR) player.userData.armR.rotation.z = -0.3 - Math.sin((1-t)*Math.PI)*1.6;
      if (player.userData.bag) player.userData.bag.rotation.y = -Math.sin((1-t)*Math.PI)*2.0;
    } else if (G.posture===Posture.STANDING){
      if (player.userData.armR) player.userData.armR.rotation.z = -0.3;
      if (player.userData.bag) player.userData.bag.rotation.y = 0;
    }
    if (G.bagCooldown>0) G.bagCooldown-=dt;
    if (G.stun>0) G.stun-=dt;

    // 살짝 걷기 바운스
    if ((mx||mz) && canMove){ player.position.y = Math.abs(Math.sin(performance.now()*0.012))*0.05; }
    else player.position.y = Math.max(0, player.position.y-dt*0.5);
  }

  /* ============ Seat competition ============ */
  function updateSeatRush(dt){
    const px=player.position.x, pz=player.position.z;
    const seat = nearestEmptySeat(px,pz,1.3);
    // 플레이어 게이지
    if (seat && G.posture===Posture.STANDING){
      setInteract('SPACE 연타: 자리 차지!');
      UI.seatWrap.classList.add('show');
      UI.seatFill.style.width = seat.captureProgress+'%';
      // 자연 감소
      if (seat.captureBy==='player' || seat.captureBy===null){
        seat.captureProgress = Math.max(0, seat.captureProgress - BALANCE.seatCaptureDecayPerSecond*dt);
      }
    } else {
      UI.seatWrap.classList.remove('show');
    }

    // NPC 경쟁: 목표 좌석으로 이동 후 게이지
    npcs.forEach(n=>{
      if (n.kind!=='competitor' || n.seated) return;
      if (!n.targetSeat || n.targetSeat.occupied){
        n.targetSeat = pickTargetSeatForNPC(n);
      }
      const s = n.targetSeat;
      if (!s){ // 좌석 없음 → 통로 대기
        moveNPCTo(n, n.standSpot.x, n.standSpot.z, dt); return;
      }
      const tx=s.interactionPoint.x, tz=s.interactionPoint.z;
      const arrived = moveNPCTo(n, tx, tz, dt);
      if (arrived && !s.occupied){
        if (s.captureBy!=='player'){ s.captureBy='npc:'+npcs.indexOf(n); }
        // 플레이어가 경쟁중이 아니면 NPC가 채움
        if (s.captureBy!=='player'){
          s.captureProgress += BALANCE.npcCaptureRatePerSecond*dt;
          if (s.captureProgress>=100){ npcSit(n,s); }
        }
      }
    });
  }

  function pickTargetSeatForNPC(n){
    let best=null,bd=1e9;
    seats.forEach(s=>{ if(s.occupied) return;
      const d=dist2(n.x,n.z,s.interactionPoint.x,s.interactionPoint.z);
      if(d<bd){bd=d;best=s;} });
    return best;
  }
  function npcSit(n,s){
    s.occupied=true; s.occupant=n; n.seated=true; n.seatRef=s;
    n.mesh.position.set(s.x,0,s.z); n.mesh.scale.set(1,0.72,1);
  }
  function moveNPCTo(n, tx, tz, dt){
    const dx=tx-n.x, dz=tz-n.z; const d=Math.hypot(dx,dz);
    if (d<0.15) return true;
    const spd=2.6;
    n.x += dx/d*spd*dt; n.z += dz/d*spd*dt;
    n.mesh.position.set(n.x, Math.abs(Math.sin(performance.now()*0.01+n.wobble))*0.04, n.z);
    n.mesh.rotation.y = Math.atan2(dx,dz);
    return false;
  }

  // 착석하지 않은 NPC들이 통로를 자유롭게 배회
  function updateNPCWander(dt){
    npcs.forEach(n=>{
      if (n.seated || n.isYielder) return;
      n.wanderTimer -= dt;
      const dx=n.wanderTX-n.x, dz=n.wanderTZ-n.z;
      const d=Math.hypot(dx,dz);
      // 목표 도달했거나 시간이 다 되면 새 목표 선정
      if (d<0.25 || n.wanderTimer<=0){
        n.wanderTX = CAR.xMin + Math.random()*(CAR.xMax-CAR.xMin);
        n.wanderTZ = CAR.aisleZMin + Math.random()*(CAR.aisleZMax-CAR.aisleZMin);
        n.wanderTimer = 1.5 + Math.random()*2.5;
      } else {
        n.x += dx/d*n.wanderSpeed*dt;
        n.z += dz/d*n.wanderSpeed*dt;
        n.x = THREE.MathUtils.clamp(n.x, CAR.xMin, CAR.xMax);
        n.z = THREE.MathUtils.clamp(n.z, CAR.aisleZMin, CAR.aisleZMax);
        n.mesh.position.set(n.x, Math.abs(Math.sin(performance.now()*0.011+n.wobble))*0.05, n.z);
        n.mesh.rotation.y = Math.atan2(dx,dz);
      }
      // NPC끼리 가볍게 밀어내기 (겹침 방지)
      npcs.forEach(m=>{
        if (m===n || m.seated) return;
        const ddx=n.x-m.x, ddz=n.z-m.z; const dd=Math.hypot(ddx,ddz);
        if (dd<0.7 && dd>0.001){ const p=(0.7-dd)/2; n.x+=ddx/dd*p; n.z+=ddz/dd*p;
          n.z=THREE.MathUtils.clamp(n.z,CAR.aisleZMin,CAR.aisleZMax);
          n.mesh.position.x=n.x; n.mesh.position.z=n.z; }
      });
    });
  }

  /* ============ Villain AI ============ */
  function updateVillains(dt){
    const px=player.position.x, pz=player.position.z;
    villains.forEach(v=>{
      if (v.defeated) return;
      v.timer+=dt; if(v.dmgCooldown>0) v.dmgCooldown-=dt;
      if (v.hitFlash>0){ v.hitFlash-=dt; }

      // 공통 시각: 히트시 흔들림
      const flash = v.hitFlash>0 ? Math.sin(performance.now()*0.05)*0.15 : 0;

      if (v.type==='drunk'){
        // WANDER / STAGGER / HIT
        if (v.state==='HIT'){ if(v.timer>0.3){ v.state='WANDER'; v.timer=0; } }
        else {
          // 불규칙 이동 + 비틀
          if (v.timer>1.4){ v.dirX=(Math.random()<0.5?-1:1); v.dirZ=(Math.random()<0.5?-1:1); v.timer=0; }
          v.x += v.dirX*1.4*dt + Math.sin(performance.now()*0.008)*0.01;
          v.z += v.dirZ*0.6*dt;
        }
        v.mesh.rotation.z = Math.sin(performance.now()*0.006)*0.25 + flash;
      } else {
        // backpack: MOVE→TELEGRAPH→SPIN→COOLDOWN
        if (v.state==='MOVE'){
          const dx=px-v.x; v.x += Math.sign(dx)*1.1*dt;
          if (Math.abs(px-v.x)<2.2 && v.timer>2){ v.state='TELEGRAPH'; v.telegraph=1.0; v.timer=0; }
        } else if (v.state==='TELEGRAPH'){
          v.telegraph-=dt;
          v.mesh.rotation.z = Math.sin(performance.now()*0.03)*0.3; // 예고 흔들림
          if (v.telegraph<=0){ v.state='SPIN'; v.spinTimer=0.7; v.timer=0; }
        } else if (v.state==='SPIN'){
          v.spinTimer-=dt;
          v.mesh.rotation.y += dt*14;
          // 회전 중 범위 피해
          if (Math.hypot(px-v.x,pz-v.z)<2.0 && v.dmgCooldown<=0){
            v.dmgCooldown=0.8;
            if (G.posture===Posture.SEATED){ /* 피해 없음 */ }
            else if (G.posture===Posture.HOLDING_HANDLE){ damage(BALANCE.villainCollisionDamage*0.3); }
            else { damage(BALANCE.villainCollisionDamage); knockPlayerFrom(v); }
          }
          if (v.spinTimer<=0){ v.state='COOLDOWN'; v.cooldown=1.5; v.timer=0; }
        } else if (v.state==='COOLDOWN'){
          v.cooldown-=dt; v.mesh.rotation.y=0;
          if (v.cooldown<=0){ v.state='MOVE'; v.timer=0; }
        } else if (v.state==='HIT'){
          if (v.timer>0.3){ v.state='MOVE'; v.timer=0; }
        }
        v.mesh.rotation.z += flash;
      }

      // 경계
      v.x=THREE.MathUtils.clamp(v.x,CAR.xMin,CAR.xMax);
      v.z=THREE.MathUtils.clamp(v.z,-1.2,1.2);
      v.mesh.position.set(v.x, 0, v.z);

      // 취객 근접 충돌 피해 (서 있는 플레이어)
      if (v.type==='drunk' && G.posture!==Posture.SEATED){
        const d=Math.hypot(px-v.x,pz-v.z);
        if (d<0.85 && v.dmgCooldown<=0){
          v.dmgCooldown=1.0;
          damage(BALANCE.villainCollisionDamage);
          G.stun=0.3; G.shake=Math.max(G.shake,0.2);
          knockPlayerFrom(v);
        }
      }
    });
  }

  function knockPlayerFrom(v){
    const dx=player.position.x-v.x, dz=player.position.z-v.z;
    const d=Math.hypot(dx,dz)||1;
    const r=resolvePlayerBounds(player.position.x+dx/d*0.8, player.position.z+dz/d*0.8);
    player.position.x=r.x; player.position.z=r.z;
  }

  /* ============ Health drain / recovery ============ */
  function updateVitals(dt){
    if (G.state!==GameState.TRAVELING) return;
    // 버프 타이머
    if (G.kindness.active){ G.kindness.remaining-=dt; if(G.kindness.remaining<=0){ G.kindness.active=false; G.kindness.mult=1; } }
    if (G.villainRewardBuff>0){ G.villainRewardBuff-=dt; }
    if (G.prioritySeatTimer>0){ G.prioritySeatTimer-=dt; }

    let drainMult = 1;
    if (G.kindness.active) drainMult *= G.kindness.mult;
    if (G.villainRewardBuff>0) drainMult *= 0.7;

    // 빌런 근접시 가중
    let nearVillain=false;
    villains.forEach(v=>{ if(!v.defeated && Math.hypot(v.x-player.position.x,v.z-player.position.z)<2.2) nearVillain=true; });

    if (G.posture===Posture.STANDING){
      let d = BALANCE.standingDrainPerSecond;
      if (nearVillain) d *= BALANCE.villainDrainMultiplier;
      damage(d*drainMult*dt);
    } else if (G.posture===Posture.SEATED){
      heal(BALANCE.seatedRecoveryPerSecond*dt);
    } else if (G.posture===Posture.HOLDING_HANDLE){
      damage(BALANCE.handleDrainPerSecond*drainMult*dt);
    }
  }

  /* ============ Interaction prompt (TRAVELING/ARRIVAL) ============ */
  function updateInteractPrompt(){
    if (G.state===GameState.SEAT_RUSH) return; // seatRush에서 처리
    const px=player.position.x, pz=player.position.z;

    if (G.state===GameState.ARRIVAL){
      if (G.posture!==Posture.STANDING) setInteract('E: 일어나서 문으로 이동하세요');
      else setInteract('문으로 이동하세요! (출구로 하차)');
      return;
    }
    if (G.state!==GameState.TRAVELING){ setInteract(''); return; }

    if (G.posture===Posture.SEATED){ setInteract('E: 일어서기'); return; }
    if (G.posture===Posture.HOLDING_HANDLE){ setInteract('E: 손잡이 놓기'); return; }

    // STANDING
    let nearVillain=false;
    villains.forEach(v=>{ if(!v.defeated && Math.hypot(v.x-px,v.z-pz)<2.4) nearVillain=true; });
    const seat = nearestEmptySeat(px,pz,1.2);
    const handle = nearestFreeHandle(px,pz,1.1);
    if (nearVillain) setInteract('F / 좌클릭: 가방 휘두르기');
    else if (seat) setInteract('E: 빈자리에 앉기' + (G.prioritySeatTimer>0?' (우선 착석 기회!)':''));
    else if (handle) setInteract('E: 손잡이 잡기');
    else setInteract('');
  }

  /* ============ E 상호작용 ============ */
  function handleInteractKey(){
    const px=player.position.x, pz=player.position.z;
    if (G.state===GameState.SEATED) {}
    if (G.posture===Posture.SEATED){ standUpFromSeat(); return; }
    if (G.posture===Posture.HOLDING_HANDLE){ releaseHandle(); return; }
    if (G.state===GameState.TRAVELING){
      const seat = nearestEmptySeat(px,pz,1.2);
      if (seat){ sitOnSeat(seat); showCenter('착석! 체력 회복 시작', false, 1.0); return; }
      const handle = nearestFreeHandle(px,pz,1.1);
      if (handle){ grabHandle(handle); showCenter('손잡이를 잡았습니다', false, 1.0); return; }
    }
  }

  /* ============ State transitions ============ */
  function enterState(s){
    G.state = s; G.stateTimer = 0;
    if (s===GameState.BOARDING){
      openDoors();
      // 플레이어 문 앞에 배치
      player.position.set(0.4, 0, CAR.aisleZMax-0.2);
      setPosture(Posture.STANDING);
      showCenter('지하철이 도착했습니다. 탑승하세요!', false, 1.6);
    }
    else if (s===GameState.SEAT_RUSH){
      showCenter('좌석 경쟁! 빈자리로!', false, 1.4);
    }
    else if (s===GameState.TRAVELING){
      UI.seatWrap.classList.remove('show');
      closeDoors();
      // 미착석 경쟁 NPC는 통로에 정리
      showCenter('출발합니다. 45초간 생존!', false, 1.4);
    }
    else if (s===GameState.ARRIVAL){
      openDoors();
      exitMarker.material.opacity = 0.55;
      showCenter('목적지입니다. 문으로 이동하세요!', false, 2.2);
      G.arrivalTimeLeft = BALANCE.arrivalExitDuration;
      // 앉아있거나 손잡이면 자동 해제 안내(수동 E 가능) — 여기선 자동 기립
      if (G.posture===Posture.SEATED) standUpFromSeat();
      if (G.posture===Posture.HOLDING_HANDLE) releaseHandle();
    }
  }

  function openDoors(){ G.doorsOpen=true; }
  function closeDoors(){ G.doorsOpen=false; }

  function updateDoors(dt){
    const halfDoor = CAR.doorX;
    const targetL = G.doorsOpen ? -halfDoor*1.5 : -halfDoor/2;
    const targetR = G.doorsOpen ?  halfDoor*1.5 :  halfDoor/2;
    doorLeft.position.x += (targetL - doorLeft.position.x)*Math.min(1,dt*5);
    doorRight.position.x += (targetR - doorRight.position.x)*Math.min(1,dt*5);
  }

  /* ============ Main state update ============ */
  function updateStates(dt){
    G.stateTimer += dt;
    switch(G.state){
      case GameState.BOARDING: {
        // NPC 승강장→통로 진입
        npcs.forEach(n=>{ if(n.kind==='competitor' && !n.seated){
          moveNPCTo(n, n.standSpot.x, Math.min(n.standSpot.z, 0.6), dt);
        }});
        if (G.stateTimer >= BALANCE.boardingDuration){ enterState(GameState.SEAT_RUSH); }
        break;
      }
      case GameState.SEAT_RUSH: {
        updateSeatRush(dt);
        // 플레이어 착석 게이지 완료 체크는 SPACE 입력에서
        const allOccupied = seats.every(s=>s.occupied);
        if (G.stateTimer >= BALANCE.seatRushDuration || allOccupied){
          enterState(GameState.TRAVELING);
        }
        break;
      }
      case GameState.TRAVELING: {
        G.timeLeft -= dt;
        G.stageElapsed += dt;
        updateStationProgress();
        updateScriptedEvents(dt);
        updateVitals(dt);
        updateVillains(dt);
        updateNPCWander(dt);
        updateInteractPrompt();
        if (G.honor<=0 && !G._honorZeroWarned){ G._honorZeroWarned=true; }
        if (G.timeLeft<=0){ enterState(GameState.ARRIVAL); }
        break;
      }
      case GameState.EVENT: {
        // 모달 대기 — 타이머 정지, 배경 유지
        break;
      }
      case GameState.ARRIVAL: {
        G.arrivalTimeLeft -= dt;
        updateVillains(dt); // 빌런 잔여 이동만
        updateNPCWander(dt);
        updateInteractPrompt();
        // 출구 도달 판정: 문 밖(z <= farWall-1.0) & 문 x 범위
        const px=player.position.x, pz=player.position.z;
        if (Math.abs(px)<CAR.doorX+0.3 && pz < CAR.farWallZ + 0.4){
          judgeArrival();
        } else if (G.arrivalTimeLeft<=0){
          endGame(false, '제한 시간 안에 하차하지 못했습니다.');
        }
        // 시간 표시 재활용
        G.timeLeft = G.arrivalTimeLeft;
        break;
      }
    }
  }

  function judgeArrival(){
    if (G.health<=0){ endGame(false,'체력이 모두 소진되었습니다.'); return; }
    if (G.honor<=0){ endGame(false,'명예가 바닥나 하차에 실패했습니다.'); return; }
    endGame(true, '무사히 목적지에 하차했습니다!');
  }

  /* ============ End game / result ============ */
  function endGame(success, reason){
    if (G.state===GameState.CLEAR || G.state===GameState.GAME_OVER) return;
    G.state = success ? GameState.CLEAR : GameState.GAME_OVER;
    const ov = document.getElementById('resultOverlay');
    document.getElementById('resultTitle').textContent = success? '🎉 생존 성공!' : '💀 GAME OVER';
    document.getElementById('resultReason').textContent = reason;
    document.getElementById('resultStats').innerHTML =
      '<div class="resultStat">남은 체력: <b>'+Math.round(G.health)+'</b></div>'+
      '<div class="resultStat">명예: <b>'+Math.round(G.honor)+'</b> ('+honorGrade(G.honor)+')</div>'+
      '<div class="resultStat">빌런 퇴치: <b>'+G.villainsDefeated+'</b>회</div>'+
      '<div class="resultStat">선행: <b>'+G.goodDeeds+'</b>회</div>';
    ov.classList.remove('hidden');
    document.getElementById('eventOverlay').classList.add('hidden');
    setInteract('');
    UI.seatWrap.classList.remove('show');
  }

  /* ============ Reset and restart ============ */
  function clearDynamicObjects(){
    npcs.forEach(n=> scene.remove(n.mesh)); npcs=[];
    villains.forEach(v=> scene.remove(v.mesh)); villains=[];
    seats.forEach(s=>{ s.occupied=false; s.occupant=null; s.captureProgress=0; s.captureBy=null;
      s.mesh.scale.set(1,1,1); });
    handles.forEach(h=>{ h.occupied=false; h.occupant=null; });
    exitMarker.material.opacity = 0.0;
  }

  function startNewGame(){
    // 오버레이 정리
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('resultOverlay').classList.add('hidden');
    document.getElementById('eventOverlay').classList.add('hidden');
    // 상태 초기화
    resetGameData();
    clearDynamicObjects();
    // 키 입력 초기화
    for (const k in keys) keys[k]=false;
    leftMouseDown=false;
    // 플레이어 초기화
    setPosture(Posture.STANDING);
    player.scale.set(1,1,1);
    player.position.set(0.4,0, CAR.aisleZMax-0.2);
    player.rotation.y=0;
    // 승객 재생성
    spawnPassengers();
    // 문 닫힘에서 시작 → BOARDING 진입(3초 후 열림 연출 위해 우선 닫고 살짝 뒤 open)
    G.doorsOpen=false;
    G.timeLeft = BALANCE.stageDuration;
    enterState(GameState.BOARDING);
  }

  /* ============ Camera follow ============ */
  function updateCamera(dt){
    const p = player.position;
    let sx=0, sz=0;
    if (G.shake>0){ G.shake-=dt*1.5; const s=Math.max(0,G.shake);
      sx=(Math.random()-0.5)*s; sz=(Math.random()-0.5)*s; }
    const camX = THREE.MathUtils.clamp(p.x, -3.5, 3.5);
    const tx = camX + sx;
    camera.position.x += (tx - camera.position.x)*Math.min(1,dt*4);
    camera.position.y = 9;
    camera.position.z = 10 + sz;
    camera.lookAt(camX, 0.8, p.z*0.3);
  }

  /* ============ Animation loop ============ */
  function animate(){
    requestAnimationFrame(animate);
    let dt = clock.getDelta();
    if (dt>0.05) dt=0.05; // 탭 비활성 등으로 큰 dt 방지

    if (G.state!==GameState.READY && G.state!==GameState.CLEAR && G.state!==GameState.GAME_OVER){
      updatePlayer(dt);
      resolveNPCPush();
      updateStates(dt);
    }
    updateDoors(dt);
    updateCamera(dt);

    // 중앙 메시지 페이드
    if (centerTimer>0){ centerTimer-=dt; if(centerTimer<=0) UI.centerMsg.classList.remove('show'); }

    updateHUD();
    renderer.render(scene, camera);
  }

  /* ============ Input ============ */
  function onKeyDown(e){
    const k = e.key.toLowerCase();
    // 이벤트 모달 중 1/2 선택
    if (G.state===GameState.EVENT){
      if (k==='1'){ resolveYield(1); return; }
      if (k==='2'){ resolveYield(2); return; }
      return; // 그 외 입력 차단
    }
    if (keys[k]) { return; } // 반복 방지 일부
    keys[k]=true;

    if (G.state===GameState.SEAT_RUSH && k===' '){
      // 좌석 경쟁 연타
      const seat = nearestEmptySeat(player.position.x, player.position.z, 1.3);
      if (seat && G.posture===Posture.STANDING && !seat.occupied){
        seat.captureBy='player';
        seat.captureProgress = Math.min(100, seat.captureProgress + BALANCE.seatCaptureGainPerPress);
        if (seat.captureProgress>=100){ sitOnSeat(seat); showCenter('자리 차지 성공! 체력 회복', false, 1.4); }
      }
    }
    if (k==='e'){ handleInteractKey(); }
    if (k==='f'){ tryBagAttack(); }
    if (k===' ') { /* SEAT_RUSH 외에는 상호작용 예비 */ }
  }
  function onKeyUp(e){ keys[e.key.toLowerCase()]=false; }

  function onMouseDown(e){
    if (e.button===0){ leftMouseDown=true;
      if (G.state===GameState.TRAVELING || G.state===GameState.ARRIVAL) tryBagAttack();
    }
  }
  function onMouseUp(e){ if(e.button===0) leftMouseDown=false; }
  function onBlur(){ for(const k in keys) keys[k]=false; leftMouseDown=false; }

  function onResize(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  /* ============ Bootstrap (이벤트 리스너 1회만 등록) ============ */
  function bindEventsOnce(){
    if (bindEventsOnce._done) return; bindEventsOnce._done=true;
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    window.addEventListener('mousedown', onMouseDown);
    window.addEventListener('mouseup', onMouseUp);
    window.addEventListener('blur', onBlur);
    window.addEventListener('resize', onResize);
    // 좌클릭 방향 조준 방지용: canvas 우클릭 메뉴 차단
    renderer.domElement.addEventListener('contextmenu', e=>e.preventDefault());

    document.getElementById('startBtn').addEventListener('click', startNewGame);
    document.getElementById('restartBtn').addEventListener('click', startNewGame);
    document.getElementById('reloadBtn').addEventListener('click', ()=>location.reload());
    document.getElementById('choice1').addEventListener('click', ()=>{ if(G.state===GameState.EVENT) resolveYield(1); });
    document.getElementById('choice2').addEventListener('click', ()=>{ if(G.state===GameState.EVENT) resolveYield(2); });
  }

  function main(){
    initScene();
    buildEnvironment();
    buildPlayer();
    resetGameData();
    bindEventsOnce();
    if (!started){ started=true; animate(); }
  }

  window.addEventListener('load', main);
  </script>
</body>
</html>
